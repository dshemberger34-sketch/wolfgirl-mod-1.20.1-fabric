name: Build mod

on:
  push:
    paths:
      - 'wolfgirl-mod-1.20.1-fabric-src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build
        working-directory: wolfgirl-mod-1.20.1-fabric-src
        run: gradle build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfgirl-mod
          path: wolfgirl-mod-1.20.1-fabric-src/build/libs/wolfgirl-1.0.0.jar
          if-no-files-found: error

      - name: Publish jar to build-output/
        run: |
          mkdir -p build-output
          cp wolfgirl-mod-1.20.1-fabric-src/build/libs/wolfgirl-1.0.0.jar build-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-output/wolfgirl-1.0.0.jar
          if git diff --cached --quiet; then
            echo "Jar unchanged, skipping commit"
          else
            git commit -m "ci: build wolfgirl-1.0.0.jar [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
